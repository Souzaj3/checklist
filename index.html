  --navy:#0b1f3a; --navy2:#12305e; --blue:#1d4e9e; --red:#c8102e; --red2:#8e0b20;
  --black:#0a0a0a; --white:#ffffff; --ink:#0f1726; --muted:#5b6678; --line:#dde3ec;
  --ok:#14803c; --warn:#c77700; --bg:#eef2f7;
  --grad-main:linear-gradient(120deg,var(--black) 0%,var(--navy) 40%,var(--navy2) 65%,var(--red) 100%);
  --grad-red:linear-gradient(135deg,#e01e3c 0%,var(--red) 50%,var(--red2) 100%);
  --grad-navy:linear-gradient(135deg,var(--blue) 0%,var(--navy2) 55%,var(--navy) 100%);
  --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);
  background:linear-gradient(180deg,#dfe6f0 0%,var(--bg) 35%,#f7f8fb 100%);min-height:100vh;font-size:16px}
button,input,select,textarea{font:inherit}
.hidden{display:none!important}

/* topo */
.topbar{background:var(--grad-main);color:#fff;padding:12px 18px;display:flex;align-items:center;gap:12px;
  position:sticky;top:0;z-index:20;box-shadow:0 4px 18px rgba(0,0,0,.25)}
.topbar .logo{width:44px;height:44px;flex:none}
.topbar h1{font-size:18px;margin:0;line-height:1.1}
.topbar small{opacity:.8;font-size:12px}
.topbar .sp{flex:1}
.topbar .user{text-align:right;font-size:13px;line-height:1.2}
.topbar button{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:10px;padding:8px 12px;cursor:pointer}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 14px;background:linear-gradient(90deg,var(--navy) 0%,var(--navy2) 70%,#3a1a2e 100%)}
.tabs button{flex:none;background:transparent;color:#cfd8e6;border:0;padding:9px 14px;border-radius:999px;cursor:pointer;font-weight:600}
.tabs button.on{background:var(--grad-red);color:#fff;box-shadow:0 2px 10px rgba(200,16,46,.45)}

main{max-width:1150px;margin:0 auto;padding:18px 14px 80px}
h2{margin:6px 0 14px;font-size:22px}
h3{margin:18px 0 10px;font-size:17px}

/* cartões */
.card{background:#fff;border-radius:var(--radius);box-shadow:0 2px 12px rgba(11,31,58,.08);padding:16px;margin-bottom:14px;position:relative;overflow:hidden}
.card.accent::before{content:"";position:absolute;left:0;top:0;right:0;height:5px;background:var(--grad-main)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.maq{cursor:pointer;transition:transform .12s, box-shadow .12s;border:2px solid transparent}
.maq:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(11,31,58,.16)}
.maq .top{display:flex;align-items:center;gap:12px}
.maq .icon{width:64px;height:64px;border-radius:12px;background:var(--grad-navy);display:flex;align-items:center;justify-content:center;flex:none}
.maq .tag{font-size:24px;font-weight:800;letter-spacing:.5px}
.maq .meta{color:var(--muted);font-size:13px;margin-top:2px}
.maq .rows{margin-top:12px;font-size:14px;display:grid;gap:4px}
.maq.disabled{opacity:.75;cursor:not-allowed}

.badge{display:inline-block;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;color:#fff;white-space:nowrap}
.b-ok{background:linear-gradient(135deg,#1fa352,var(--ok))}
.b-red{background:var(--grad-red)}
.b-warn{background:linear-gradient(135deg,#f0a020,var(--warn))}
.b-blue{background:var(--grad-navy)}
.b-gray{background:linear-gradient(135deg,#8892a3,#5b6678)}

/* botões */
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:700;cursor:pointer;color:#fff;background:var(--grad-navy);
  box-shadow:0 3px 10px rgba(11,31,58,.25);display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn.red{background:var(--grad-red);box-shadow:0 3px 10px rgba(200,16,46,.3)}
.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line);box-shadow:none}
.btn.ok{background:linear-gradient(135deg,#1fa352,var(--ok))}
.btn.sm{padding:7px 12px;font-size:14px;border-radius:10px}
.btn.big{width:100%;padding:16px;font-size:18px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* formulários */
label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:10px 0 4px}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue);border-color:transparent}
.f2{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:0 12px}

/* login */
.login-wrap{position:relative;min-height:100vh;display:flex;align-items:flex-end;justify-content:center;padding:20px 20px 4vh;overflow:hidden;background:#0a0a0a}
/* fundo desfocado preenche as sobras, a foto inteira fica nítida por cima */
.login-wrap .fundo-blur{position:absolute;inset:-40px;background:var(--foto-fundo) center/cover no-repeat;filter:blur(24px) brightness(.5) saturate(1.2)}
.login-wrap .fundo-foto{position:absolute;inset:0;background:var(--foto-fundo) center/contain no-repeat}
.login-wrap .fundo-cor{position:absolute;inset:0;background:linear-gradient(135deg,rgba(10,10,10,.45) 0%,rgba(11,31,58,.25) 45%,rgba(11,31,58,.05) 60%,rgba(200,16,46,.25) 100%)}
.login{position:relative;z-index:2;background:rgba(255,255,255,.96);border-radius:20px;max-width:360px;width:100%;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.55);border-top:5px solid transparent;
  background-image:linear-gradient(rgba(255,255,255,.97),rgba(255,255,255,.97)),var(--grad-main);background-origin:border-box;background-clip:padding-box,border-box}
.login input[name="m"]::placeholder{text-transform:none}
@media (max-aspect-ratio:1/1){
  .login-wrap{align-items:flex-end;padding-bottom:8vh}
  .login-wrap .fundo-foto{background-position:center 10%}
}
.login .head{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.login .head .lg{width:56px;height:56px;border-radius:14px;background:var(--grad-main);display:flex;align-items:center;justify-content:center}

/* checklist */
.sec-title{display:flex;align-items:center;gap:10px;padding:12px 16px;margin:-16px -16px 12px;color:#fff;background:var(--grad-navy)}
.sec-title .n{font-weight:800}
.item{border-bottom:1px solid var(--line);padding:12px 0}
.item:last-child{border-bottom:0}
.item .q{display:flex;gap:10px;align-items:flex-start}
.item .q .txt{flex:1;font-weight:600}
.item .q .acao{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase}
.help{background:none;border:1px solid var(--line);border-radius:50%;width:30px;height:30px;cursor:pointer;color:var(--navy);font-weight:800;flex:none}
.metodo{background:#f3f6fb;border-left:4px solid var(--blue);padding:8px 12px;border-radius:8px;margin-top:8px;font-size:14px;color:#33405a}
.seg{display:flex;gap:6px;margin-top:10px}
.seg button{flex:1;padding:12px 0;border-radius:10px;border:2px solid var(--line);background:#fff;font-weight:800;cursor:pointer;font-size:16px}
.seg button.on.C{background:linear-gradient(135deg,#1fa352,var(--ok));color:#fff;border-color:transparent}
.seg button.on.NC{background:var(--grad-red);color:#fff;border-color:transparent}
.seg button.on.NA{background:linear-gradient(135deg,#8892a3,#5b6678);color:#fff;border-color:transparent}
.ncbox{margin-top:10px;padding:12px;border-radius:10px;background:linear-gradient(135deg,#fff1f3,#fff)}
.foto-slot{display:flex;align-items:center;gap:12px;padding:10px;border:2px dashed var(--line);border-radius:12px;margin-top:8px;background:#fafbfd}
.foto-slot img{width:96px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.foto-slot .ph{width:96px;height:72px;border-radius:8px;background:var(--grad-navy);display:flex;align-items:center;justify-content:center;color:#fff;font-size:26px;flex:none}
.foto-slot .info{flex:1;font-size:14px}
.foto-slot.done{border-style:solid;border-color:#9fd3b0;background:#f2fbf5}
.progress{height:8px;border-radius:99px;background:#e3e8f0;overflow:hidden;margin:8px 0 2px}
.progress>div{height:100%;background:var(--grad-main);transition:width .2s}
.sticky-bottom{position:sticky;bottom:0;background:linear-gradient(180deg,rgba(238,242,247,0),#eef2f7 30%);padding:16px 0 10px}

/* tabelas */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{background:var(--grad-navy);color:#fff;text-align:left;padding:10px;font-weight:700;white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:hover td{background:#f7f9fc}
.scroll{overflow-x:auto}
.alert{padding:12px 14px;border-radius:12px;margin-bottom:10px;display:flex;gap:10px;align-items:center;color:#fff}
.alert.red{background:var(--grad-red)}
.alert.warn{background:linear-gradient(135deg,#f0a020,#c77700)}
.alert.blue{background:var(--grad-navy)}
.alert .grow{flex:1}

/* modal / câmera */
.modal-bg{position:fixed;inset:0;background:rgba(5,10,20,.72);z-index:50;display:flex;align-items:center;justify-content:center;padding:14px}
.modal{background:#fff;border-radius:18px;max-width:720px;width:100%;max-height:92vh;overflow:auto;padding:18px;position:relative}
.modal .x{position:absolute;top:10px;right:12px;background:none;border:0;font-size:26px;cursor:pointer;color:var(--muted)}
.cam{position:fixed;inset:0;background:#000;z-index:60;display:flex;flex-direction:column}
.cam .bar{padding:10px 14px;color:#fff;background:var(--grad-main);font-weight:700}
.cam video,.cam img{flex:1;width:100%;min-height:0;object-fit:contain;background:#000}
.cam .ctrl{display:flex;gap:12px;padding:14px;justify-content:center;background:linear-gradient(0deg,#000,#0b1f3a)}
.shoot{width:76px;height:76px;border-radius:50%;border:5px solid #fff;background:var(--grad-red);cursor:pointer}
.thumbs{display:flex;flex-wrap:wrap;gap:10px}
.thumbs figure{margin:0;width:150px}
.thumbs img{width:150px;height:112px;object-fit:cover;border-radius:10px;cursor:zoom-in;border:1px solid var(--line);background:#eee}
.thumbs figcaption{font-size:12px;color:var(--muted);margin-top:3px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:80;padding:13px 18px;border-radius:12px;color:#fff;font-weight:700;
  box-shadow:0 8px 30px rgba(0,0,0,.3);max-width:92vw;background:var(--grad-navy)}
.toast.err{background:var(--grad-red)}
.toast.ok{background:linear-gradient(135deg,#1fa352,var(--ok))}
.muted{color:var(--muted)}
.loading{padding:30px;text-align:center;color:var(--muted)}

<script>
/* ================== CONFIGURAÇÃO ================== */
const SB_URL = 'https://jbtkbalmehuljqzbkpcw.supabase.co';
const SB_KEY = 'sb_publishable_IvKIva7eMn5nFTxLLjnr1w_PoFs25xG';
const DOMINIO = '@empilhadeiras.app';
// Matrícula: 8 números + letras (inicial do nome, ou sobrenome + inicial do nome). Ex.: 10109256J
const MATRICULA_OK = /^[0-9]{8}[A-Z]{1,20}$/;
const TZ = 'America/Sao_Paulo';
const INATIVIDADE_MIN = 10; // operador sai sozinho após 10 min parado (tablet compartilhado)

const sb = supabase.createClient(SB_URL, SB_KEY);
const S = { user:null, perfil:null, tab:null, offset:0 };

const EQUIP_TIPOS = { coletor:'Coletor veicular', scanner:'Pistola leitora', camera:'Câmera do garfo + monitor', redzone:'Red Zone', bluespot:'Blue Spot', outro:'Outro' };
const PERFIS = { admin:'Administrador', lider:'Líder', operador:'Operador' };
const PERFIL_BADGE = { admin:'b-red', lider:'b-warn', operador:'b-blue' };
const gestor = () => S.perfil && S.perfil.role !== 'operador';
const ACAO = { parar:'Parar', supervisor:'Decidir c/ supervisor', na:'Registrar' };
const RESULT = { conforme:['Conforme','b-ok'], nc_supervisor:['NC – supervisor','b-warn'], nc_parar:['NC – parar','b-red'] };
const STATUS_CL = { em_andamento:['Em andamento','b-blue'], aguardando_supervisor:['Aguardando supervisor','b-warn'], finalizado:['Finalizado','b-ok'], bloqueado:['Bloqueado','b-red'] };

/* ================== UTILIDADES ================== */
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => (v === null || v === undefined || v === '') ? '–' : Number(v).toLocaleString('pt-BR', {maximumFractionDigits:0, useGrouping:false});
const lerHorimetro = v => { const t = String(v ?? '').trim(); return /^\d{1,5}$/.test(t) ? parseInt(t, 10) : NaN; };
const MSG_HORIM = 'Horímetro: use só números inteiros, sem vírgula (ex.: 3378).';
const fmtDT = iso => iso ? new Date(iso).toLocaleString('pt-BR', {timeZone:TZ, day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit'}) : '–';
const fmtD = iso => iso ? new Date(iso).toLocaleDateString('pt-BR', {timeZone:TZ}) : '–';
const fmtH = iso => iso ? new Date(iso).toLocaleTimeString('pt-BR', {timeZone:TZ, hour:'2-digit', minute:'2-digit'}) : '–';
const hojeISO = () => new Date(Date.now() + S.offset).toLocaleDateString('en-CA', {timeZone:TZ});
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));

function toast(msg, tipo='') {
  const t = document.createElement('div');
  t.className = 'toast ' + tipo; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), tipo === 'err' ? 6000 : 3500);
}
function erroMsg(e) {
  const m = e?.message || String(e);
  if (/Invalid login/i.test(m)) return 'Matrícula ou senha incorretas.';
  return m.replace(/^.*?ERROR:\s*/, '');
}
function badge(txt, cls) { return `<span class="badge ${cls}">${esc(txt)}</span>`; }

const ICON_EMPILHADEIRA = `<svg viewBox="0 0 64 64" width="46" height="46" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
  <path d="M40 8v42"/><path d="M46 8v42"/><path d="M40 14h6M40 30h6"/>
  <path d="M40 50h18"/><path d="M34 38l6-4"/>
  <path d="M10 22h16l6 10v14H10z"/><path d="M14 22v-6h10l2 6"/>
  <circle cx="16" cy="50" r="5" fill="#c8102e" stroke="#fff"/><circle cx="32" cy="50" r="4"/></svg>`;

/* ================== HORA DO SERVIDOR ================== */
async function horaServidor() {
  try {
    const t0 = Date.now();
    const { data, error } = await sb.rpc('agora');
    if (error) throw error;
    const srv = new Date(data).getTime();
    S.offset = srv - (t0 + (Date.now() - t0) / 2);
    return new Date(srv);
  } catch { return new Date(Date.now() + S.offset); }
}

/* ================== MODAIS ================== */
function modal(html, onClose) {
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal"><button class="x" aria-label="Fechar">×</button>${html}</div>`;
  const fechar = () => { bg.remove(); onClose && onClose(); };
  $('.x', bg).onclick = fechar;
  bg.addEventListener('click', e => { if (e.target === bg) fechar(); });
  document.body.appendChild(bg);
  return { el: $('.modal', bg), fechar };
}
function formModal(titulo, campos, botao='Salvar') {
  return new Promise(resolve => {
    const html = `<h2>${esc(titulo)}</h2><form>${campos.map(c => {
      const v = esc(c.value ?? '');
      let inp;
      if (c.type === 'select') inp = `<select name="${c.name}" ${c.required?'required':''}>${c.options.map(o => `<option value="${esc(o[0])}" ${String(o[0])===String(c.value??'')?'selected':''}>${esc(o[1])}</option>`).join('')}</select>`;
      else if (c.type === 'textarea') inp = `<textarea name="${c.name}" rows="3" ${c.required?'required':''}>${v}</textarea>`;
      else if (c.type === 'checkbox') inp = `<input type="checkbox" name="${c.name}" ${c.value?'checked':''} style="width:auto">`;
      else inp = `<input name="${c.name}" type="${c.type||'text'}" value="${v}" ${c.step?`step="${c.step}"`:''} ${c.required?'required':''} ${c.placeholder?`placeholder="${esc(c.placeholder)}"`:''} ${c.type==='number'?'inputmode="numeric"':''}>`;
      return `<label>${esc(c.label)}</label>${inp}`;
    }).join('')}<div class="row" style="margin-top:16px"><button class="btn red" type="submit">${esc(botao)}</button><button class="btn ghost" type="button" data-c>Cancelar</button></div></form>`;
    let done = false;
    const m = modal(html, () => { if (!done) resolve(null); });
    $('[data-c]', m.el).onclick = () => m.fechar();
    $('form', m.el).onsubmit = e => {
      e.preventDefault(); done = true;
      const out = {};
      campos.forEach(c => { const el = $(`[name="${c.name}"]`, m.el); out[c.name] = c.type === 'checkbox' ? el.checked : el.value.trim(); });
      m.fechar(); resolve(out);
    };
  });
}
function verImagem(url) { modal(`<img src="${esc(url)}" style="width:100%;border-radius:10px">`); }

/* ================== CÂMERA (sem galeria) ================== */
async function tirarFoto(titulo, tagMaquina) {
  if (!navigator.mediaDevices?.getUserMedia) {
    toast('Este navegador não permite usar a câmera. Use o Chrome atualizado.', 'err'); return null;
  }
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false });
  } catch (e) {
    toast('Não foi possível abrir a câmera. Libere a permissão de câmera para este site.', 'err'); return null;
  }
  return new Promise(resolve => {
    const wrap = document.createElement('div');
    wrap.className = 'cam';
    wrap.innerHTML = `<div class="bar">📷 ${esc(titulo)}</div><video playsinline autoplay muted></video><img class="hidden">
      <div class="ctrl"><button class="btn ghost" data-cancel>Cancelar</button><button class="shoot" data-shot aria-label="Tirar foto"></button>
      <button class="btn ghost hidden" data-redo>Tirar outra</button><button class="btn ok hidden" data-use>Usar foto</button></div>`;
    document.body.appendChild(wrap);
    const video = $('video', wrap), img = $('img', wrap);
    video.srcObject = stream;
    let blob = null;
    const parar = () => stream.getTracks().forEach(t => t.stop());
    const sair = r => { parar(); wrap.remove(); resolve(r); };
    $('[data-cancel]', wrap).onclick = () => sair(null);
    $('[data-redo]', wrap).onclick = () => {
      blob = null; img.classList.add('hidden'); video.classList.remove('hidden');
      $('[data-shot]', wrap).classList.remove('hidden'); $('[data-redo]', wrap).classList.add('hidden'); $('[data-use]', wrap).classList.add('hidden');
    };
    $('[data-shot]', wrap).onclick = async () => {
      if (!video.videoWidth) return;
      const quando = await horaServidor();
      const maxW = 1280, sc = Math.min(1, maxW / video.videoWidth);
      const w = Math.round(video.videoWidth * sc), h = Math.round(video.videoHeight * sc);
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      const ctx = cv.getContext('2d');
      ctx.drawImage(video, 0, 0, w, h);
      // carimbo com faixa em degradê
      const fh = Math.max(56, Math.round(h * 0.11));
      const g = ctx.createLinearGradient(0, 0, w, 0);
      g.addColorStop(0, 'rgba(10,10,10,.88)'); g.addColorStop(.55, 'rgba(18,48,94,.88)'); g.addColorStop(1, 'rgba(200,16,46,.88)');
      ctx.fillStyle = g; ctx.fillRect(0, h - fh, w, fh);
      const dt = quando.toLocaleString('pt-BR', { timeZone: TZ, day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit', second:'2-digit' });
      ctx.fillStyle = '#fff';
      ctx.font = `bold ${Math.round(fh*0.34)}px Arial`;
      ctx.fillText(`${tagMaquina || ''}  •  ${titulo}`.slice(0, 80), 12, h - fh + fh*0.42);
      ctx.font = `${Math.round(fh*0.28)}px Arial`;
      ctx.fillText(`${dt} (Brasília)  •  ${S.perfil.matricula} - ${S.perfil.nome}`.slice(0, 90), 12, h - fh + fh*0.82);
      blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.8));
      img.src = URL.createObjectURL(blob);
      video.classList.add('hidden'); img.classList.remove('hidden');
      $('[data-shot]', wrap).classList.add('hidden'); $('[data-redo]', wrap).classList.remove('hidden'); $('[data-use]', wrap).classList.remove('hidden');
    };
    $('[data-use]', wrap).onclick = async () => {
      const btn = $('[data-use]', wrap); btn.disabled = true; btn.textContent = 'Enviando…';
      const path = `${S.user.id}/${hojeISO()}/${uuid()}.jpg`;
      const { error } = await sb.storage.from('fotos').upload(path, blob, { contentType: 'image/jpeg', upsert: false });
      if (error) { btn.disabled = false; btn.textContent = 'Usar foto'; toast('Falha ao enviar a foto: ' + erroMsg(error), 'err'); return; }
      sair({ path, url: img.src });
    };
  });
}
async function urlFoto(path) {
  if (!path) return null;
  const { data } = await sb.storage.from('fotos').createSignedUrl(path, 3600);
  return data?.signedUrl || null;
}
function slotFoto(id, titulo, instr) {
  return `<div class="foto-slot" id="${id}"><div class="ph">📷</div><div class="info"><b>${esc(titulo)}</b><br><span class="muted">${esc(instr || 'Toque para abrir a câmera')}</span></div>
    <button type="button" class="btn sm red" data-foto="${id}">Tirar foto</button></div>`;
}
function marcarSlot(id, foto) {
  const el = document.getElementById(id); if (!el) return;
  el.classList.add('done');
  $('.ph', el).outerHTML = `<img src="${esc(foto.url)}" alt="">`;
  $('[data-foto]', el).textContent = 'Refazer';
  $('.muted', el).textContent = 'Foto registrada ✔';
}

/* ================== AUTENTICAÇÃO ================== */
async function iniciar() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return telaLogin();
  S.user = session.user;
  const { data: perfil } = await sb.from('profiles').select('*').eq('id', S.user.id).maybeSingle();
  if (!perfil || !perfil.ativo) { await sb.auth.signOut(); return telaLogin('Usuário sem acesso. Procure o administrador.'); }
  S.perfil = perfil;
  horaServidor();
  S.tab = perfil.role === 'operador' ? 'maquinas' : 'painel';
  render();
  vigiarInatividade();
}
function telaLogin(msg) {
  S.user = null; S.perfil = null;
  $('#app').innerHTML = `<div class="login-wrap"><div class="fundo-blur"></div><div class="fundo-foto"></div><div class="fundo-cor"></div><form class="login" id="fl">
    <div class="head"><div class="lg">${ICON_EMPILHADEIRA}</div><div><h2 style="margin:0">Checklist</h2><div class="muted">Empilhadeiras e equipamentos</div></div></div>
    ${msg ? `<div class="alert red">${esc(msg)}</div>` : ''}
    <label>Matrícula</label><input name="m" autocomplete="username" inputmode="text" required autofocus placeholder="Ex.: 10109256J" style="text-transform:uppercase" maxlength="28">
    <label>Senha</label><input name="s" type="password" autocomplete="current-password" required>
    <button class="btn red big" style="margin-top:18px">Entrar</button>
  </form></div>`;

  $('#fl').onsubmit = async e => {
    e.preventDefault();
    const b = $('button', e.target); b.disabled = true; b.textContent = 'Entrando…';
    const m = e.target.m.value.replace(/\s+/g, '').toUpperCase(), s = e.target.s.value;
    if (!MATRICULA_OK.test(m)) { b.disabled = false; b.textContent = 'Entrar'; return toast('Matrícula inválida: 8 números seguidos das letras (ex.: 10109256J).', 'err'); }
    const { error } = await sb.auth.signInWithPassword({ email: m.toLowerCase() + DOMINIO, password: s });
    if (error) { b.disabled = false; b.textContent = 'Entrar'; return toast(erroMsg(error), 'err'); }
    iniciar();
  };
}
async function sair() { await sb.auth.signOut(); telaLogin(); }
let timerInat;
function vigiarInatividade() {
  if (gestor()) return;
  const reset = () => { clearTimeout(timerInat); timerInat = setTimeout(() => { if (!$('.cam')) { toast('Sessão encerrada por inatividade.'); sair(); } }, INATIVIDADE_MIN * 60000); };
  ['click','touchstart','keydown'].forEach(ev => document.addEventListener(ev, reset, { passive: true }));
  reset();
}
async function trocarSenha() {
  const v = await formModal('Trocar minha senha', [
    { name:'s1', label:'Nova senha (mínimo 6 caracteres)', type:'password', required:true },
    { name:'s2', label:'Repita a nova senha', type:'password', required:true }]);
  if (!v) return;
  if (v.s1.length < 6) return toast('A senha precisa ter pelo menos 6 caracteres.', 'err');
  if (v.s1 !== v.s2) return toast('As senhas não conferem.', 'err');
  const { error } = await sb.auth.updateUser({ password: v.s1 });
  error ? toast(erroMsg(error), 'err') : toast('Senha alterada.', 'ok');
}

/* ================== ESTRUTURA ================== */
const ABAS_ADMIN = [['painel','Painel'],['maquinas','Fazer checklist'],['historico','Histórico'],['manutencoes','Manutenções'],['cadastro','Máquinas e equipamentos'],['itens','Itens do checklist'],['usuarios','Usuários']];
const ABAS_LIDER = [['painel','Painel'],['maquinas','Fazer checklist'],['historico','Histórico'],['manutencoes','Manutenções']];
function render() {
  const abas = S.perfil.role === 'admin' ? ABAS_ADMIN : S.perfil.role === 'lider' ? ABAS_LIDER : null;
  if (abas && !abas.some(a => a[0] === S.tab)) S.tab = 'painel';
  if (!abas) S.tab = 'maquinas';
  $('#app').innerHTML = `<header class="topbar"><div class="logo">${ICON_EMPILHADEIRA}</div>
    <div><h1>Checklist de Empilhadeiras</h1><small>${PERFIS[S.perfil.role]}</small></div><div class="sp"></div>
    <div class="user"><span class="nm"><b>${esc(S.perfil.nome)}</b><br>Mat. ${esc(S.perfil.matricula)}</span></div>
    <button id="bsenha" title="Trocar senha">🔑</button><button id="bsair">Sair</button></header>
    ${abas ? `<nav class="tabs">${abas.map(([k,t]) => `<button data-tab="${k}" class="${S.tab===k?'on':''}">${t}</button>`).join('')}</nav>` : ''}
    <main id="main"><div class="loading">Carregando…</div></main>`;
  $('#bsair').onclick = sair;
  $('#bsenha').onclick = trocarSenha;
  $$('[data-tab]').forEach(b => b.onclick = () => { S.tab = b.dataset.tab; render(); });
  const telas = { painel:telaPainel, maquinas:telaMaquinas, historico:telaHistorico, manutencoes:telaManutencoes, cadastro:telaCadastro, itens:telaItens, usuarios:telaUsuarios };
  (telas[S.tab] || telaMaquinas)().catch(e => { $('#main').innerHTML = `<div class="alert red">${esc(erroMsg(e))}</div>`; });
}
function statusMaquina(m) {
  if (m.status === 'bloqueada') return badge('BLOQUEADA', 'b-red');
  if (m.status === 'pendente_supervisor') return badge('Aguardando supervisor', 'b-warn');
  if (m.checklist_aberto_id) return badge('Em uso', 'b-blue');
  return badge('Liberada', 'b-ok');
}
function badgePreventiva(m) {
  if (m.horas_para_preventiva === null || m.horas_para_preventiva === undefined) return badge('Preventiva: sem horímetro', 'b-gray');
  const h = Number(m.horas_para_preventiva);
  if (h <= 0) return badge(`Preventiva VENCIDA há ${num(-h)} h`, 'b-red');
  if (h <= Number(m.aviso_antecedencia)) return badge(`Preventiva em ${num(h)} h`, 'b-warn');
  return badge(`Preventiva em ${num(h)} h`, 'b-ok');
}

/* ================== OPERADOR: LISTA DE MÁQUINAS ================== */
async function telaMaquinas() {
  const [{ data: maqs, error }, { data: meu }] = await Promise.all([
    sb.from('vw_maquinas').select('*').eq('ativa', true).order('tag'),
    sb.from('checklists').select('*, maquinas(tag)').eq('operador_id', S.user.id).in('status', ['em_andamento','aguardando_supervisor']).maybeSingle()
  ]);
  if (error) throw error;
  let html = '';
  if (meu) {
    html += meu.status === 'em_andamento'
      ? `<div class="alert blue"><div class="grow"><b>Seu turno está aberto na ${esc(meu.maquinas.tag)}</b><br>Iniciado às ${fmtH(meu.iniciado_em)} com horímetro ${num(meu.horimetro_inicial)}</div><button class="btn red" id="bfim">Finalizar turno</button></div>`
      : `<div class="alert warn"><div class="grow"><b>${esc(meu.maquinas.tag)}: aguardando decisão do supervisor</b><br>Não opere a máquina até o supervisor liberar.</div></div>`;
  }
  html += `<h2>Escolha a máquina para o checklist</h2><div class="grid">`;
  html += (maqs || []).map(m => {
    const livre = m.status === 'liberada' && !m.checklist_aberto_id && !meu;
    return `<div class="card accent maq ${livre ? '' : 'disabled'}" data-m="${m.id}" data-livre="${livre ? 1 : 0}">
      <div class="top"><div class="icon">${ICON_EMPILHADEIRA}</div><div><div class="tag">${esc(m.tag)}</div><div class="meta">${esc(m.tipo)}${m.modelo ? ' · ' + esc(m.modelo) : ''}</div></div></div>
      <div class="rows"><div>${statusMaquina(m)}</div>
        ${m.em_uso_por ? `<div>👷 ${esc(m.em_uso_por)} desde ${fmtH(m.em_uso_desde)}</div>` : ''}
        <div>⏱ Horímetro: <b>${num(m.horimetro_atual)} h</b></div><div>${badgePreventiva(m)}</div></div></div>`;
  }).join('') + '</div>';
  if (!maqs?.length) html += '<p class="muted">Nenhuma máquina cadastrada.</p>';
  $('#main').innerHTML = html;
  if (meu && $('#bfim')) $('#bfim').onclick = () => telaFinalizar(meu);
  $$('.maq').forEach(c => c.onclick = () => {
    const m = maqs.find(x => x.id === c.dataset.m);
    if (c.dataset.livre === '1') return telaChecklist(m);
    if (meu) return toast('Você já tem um turno aberto.', 'err');
    if (m.status === 'bloqueada') return toast(`${m.tag} está bloqueada. Procure o supervisor.`, 'err');
    if (m.status === 'pendente_supervisor') return toast(`${m.tag} aguarda decisão do supervisor.`, 'err');
    toast(`${m.tag} está em uso por ${m.em_uso_por}.`, 'err');
  });
}

/* ================== CHECKLIST ================== */
async function telaChecklist(m) {
  $('#main').innerHTML = '<div class="loading">Carregando checklist…</div>';
  const [{ data: grupos, error: e1 }, { data: itens, error: e2 }, { data: equips }] = await Promise.all([
    sb.rpc('grupos_da_maquina', { p_maquina: m.id }),
    sb.from('checklist_itens').select('*').eq('ativo', true).order('grupo_id').order('ordem'),
    sb.from('equipamentos').select('*').eq('maquina_id', m.id).eq('ativo', true)
  ]);
  if (e1 || e2) throw (e1 || e2);
  const st = { horim: null, fotoHor: null, fotoMaq: null, secao: {}, resp: {} };
  const itensVis = itens.filter(i => grupos.some(g => g.id === i.grupo_id));
  const totalPassos = 2 + grupos.filter(g => g.exige_foto).length + itensVis.length;

  let html = `<div class="row" style="justify-content:space-between"><h2>Checklist ${esc(m.tag)}</h2><button class="btn ghost sm" id="bvoltar">← Voltar</button></div>
    <div class="card"><div class="progress"><div id="prog" style="width:0"></div></div><div class="muted" id="progtxt"></div></div>
    <div class="card accent"><div class="sec-title"><span class="n">Início do turno</span></div>
      <label>Horímetro inicial (horas)</label><input id="horim" type="number" step="1" min="0" inputmode="numeric" pattern="[0-9]*" placeholder="${m.horimetro_atual ? 'Último registrado: ' + num(m.horimetro_atual) : 'Ex.: 1137'}">
      ${slotFoto('f-hor', 'Foto do horímetro', 'O número do horímetro precisa estar legível')}
      ${slotFoto('f-maq', 'Foto geral da máquina', 'Máquina inteira, de frente')}
    </div>`;
  grupos.forEach(g => {
    const eqs = equips.filter(e => e.tipo === g.tipo_equipamento);
    html += `<div class="card"><div class="sec-title"><span class="n">${esc(g.nome)}</span>${eqs.map(e => `<span class="badge b-red">${esc(e.modelo || '')} ${e.numero_serie ? 'S/N ' + esc(e.numero_serie) : ''}</span>`).join(' ')}</div>
      ${g.exige_foto ? slotFoto('f-g' + g.id, 'Foto: ' + g.nome, g.instrucao_foto) : ''}
      ${itensVis.filter(i => i.grupo_id === g.id).map(i => `<div class="item" data-item="${i.id}">
        <div class="q"><div class="txt">${g.id === 1 ? i.ordem + '. ' : ''}${esc(i.descricao)}<div class="acao">Se NC: ${ACAO[i.acao_nc]}</div></div><button type="button" class="help" data-help>?</button></div>
        <div class="metodo hidden">${esc(i.metodo)}</div>
        <div class="seg">${['C','NC','NA'].map(r => `<button type="button" class="${r}" data-r="${r}">${r}</button>`).join('')}</div>
        <div class="ncbox hidden"><label>O que está errado? (obrigatório)</label><textarea rows="2" data-obs></textarea>${slotFoto('f-i' + i.id, 'Foto do problema', 'Mostre o defeito na foto')}</div>
      </div>`).join('')}</div>`;
  });
  html += `<div class="sticky-bottom"><button class="btn red big" id="benviar">Enviar checklist</button></div>`;
  $('#main').innerHTML = html;
  window.scrollTo(0, 0);

  const atualizar = () => {
    let feitos = (st.fotoHor ? 1 : 0) + (st.fotoMaq ? 1 : 0) + Object.keys(st.secao).length;
    itensVis.forEach(i => { const r = st.resp[i.id]; if (r && (r.resposta !== 'NC' || (r.obs && r.foto))) feitos++; });
    const p = Math.round(feitos / totalPassos * 100);
    $('#prog').style.width = p + '%';
    $('#progtxt').textContent = `${feitos} de ${totalPassos} etapas concluídas (${p}%)`;
  };
  atualizar();
  $('#bvoltar').onclick = () => { if (confirm('Sair do checklist? O que foi preenchido será perdido.')) render(); };
  $('#horim').oninput = e => { st.horim = e.target.value; };

  $('#main').addEventListener('click', async e => {
    const help = e.target.closest('[data-help]');
    if (help) { help.closest('.item').querySelector('.metodo').classList.toggle('hidden'); return; }
    const rb = e.target.closest('[data-r]');
    if (rb) {
      const it = rb.closest('.item'), id = it.dataset.item;
      st.resp[id] = Object.assign(st.resp[id] || {}, { resposta: rb.dataset.r });
      $$('[data-r]', it).forEach(b => b.classList.toggle('on', b === rb));
      $('.ncbox', it).classList.toggle('hidden', rb.dataset.r !== 'NC');
      atualizar(); return;
    }
    const fb = e.target.closest('[data-foto]');
    if (fb) {
      const slot = fb.dataset.foto;
      const titulo = $('b', document.getElementById(slot)).textContent;
      const foto = await tirarFoto(titulo, m.tag);
      if (!foto) return;
      if (slot === 'f-hor') st.fotoHor = foto.path;
      else if (slot === 'f-maq') st.fotoMaq = foto.path;
      else if (slot.startsWith('f-g')) st.secao[slot.slice(3)] = foto.path;
      else if (slot.startsWith('f-i')) { const id = slot.slice(3); st.resp[id] = Object.assign(st.resp[id] || {}, { foto: foto.path }); }
      marcarSlot(slot, foto); atualizar();
    }
  });
  $('#main').addEventListener('input', e => {
    if (e.target.matches('[data-obs]')) {
      const id = e.target.closest('.item').dataset.item;
      st.resp[id] = Object.assign(st.resp[id] || {}, { obs: e.target.value });
      atualizar();
    }
  });

  $('#benviar').onclick = async () => {
    const h = lerHorimetro(st.horim);
    if (isNaN(h)) { toast(st.horim ? MSG_HORIM : 'Informe o horímetro inicial.', 'err'); return $('#horim').focus(); }
    if (!st.fotoHor || !st.fotoMaq) return toast('Tire as fotos do horímetro e da máquina.', 'err');
    for (const g of grupos) if (g.exige_foto && !st.secao[g.id]) { document.getElementById('f-g' + g.id).scrollIntoView({ behavior:'smooth', block:'center' }); return toast('Falta a foto da seção: ' + g.nome, 'err'); }
    for (const i of itensVis) {
      const r = st.resp[i.id];
      const el = $(`[data-item="${i.id}"]`);
      if (!r?.resposta) { el.scrollIntoView({ behavior:'smooth', block:'center' }); return toast('Responda: ' + i.descricao, 'err'); }
      if (r.resposta === 'NC' && !(r.obs || '').trim()) { el.scrollIntoView({ behavior:'smooth', block:'center' }); return toast('Descreva o problema em: ' + i.descricao, 'err'); }
      if (r.resposta === 'NC' && !r.foto) { el.scrollIntoView({ behavior:'smooth', block:'center' }); return toast('Tire a foto do problema em: ' + i.descricao, 'err'); }
    }
    if (m.horimetro_atual && h - Number(m.horimetro_atual) > 100 && !confirm(`O horímetro informado (${num(h)}) está ${num(h - m.horimetro_atual)} h acima do último registro. Confirma?`)) return;
    const b = $('#benviar'); b.disabled = true; b.textContent = 'Enviando…';
    const respostas = itensVis.map(i => ({ item_id: i.id, resposta: st.resp[i.id].resposta, observacao: st.resp[i.id].resposta === 'NC' ? st.resp[i.id].obs : null, foto: st.resp[i.id].resposta === 'NC' ? st.resp[i.id].foto : null }));
    const fotos_secao = Object.entries(st.secao).map(([g, f]) => ({ grupo_id: Number(g), foto: f }));
    const { data: id, error } = await sb.rpc('enviar_checklist', { p_maquina: m.id, p_horimetro: h, p_foto_horimetro: st.fotoHor, p_foto_maquina: st.fotoMaq, p_respostas: respostas, p_fotos_secao: fotos_secao });
    if (error) { b.disabled = false; b.textContent = 'Enviar checklist'; return toast(erroMsg(error), 'err'); }
    const { data: c } = await sb.from('checklists').select('status').eq('id', id).single();
    resultadoChecklist(m, c?.status);
  };
}
function resultadoChecklist(m, status) {
  const msgs = {
    em_andamento: ['✅', 'Máquina liberada', `Bom trabalho! No fim do turno, entre de novo e toque em "Finalizar turno" para registrar o horímetro final.`],
    aguardando_supervisor: ['⚠️', 'Aguardando supervisor', `Foi encontrado um item "Decidir com supervisor". Não opere a ${m.tag} até o supervisor liberar.`],
    bloqueado: ['⛔', 'Máquina BLOQUEADA', `Foi encontrado um item "Parar". A ${m.tag} não pode ser operada. A manutenção corretiva já foi aberta.`]
  };
  const [ic, tit, txt] = msgs[status] || msgs.em_andamento;
  const admin = gestor();
  $('#main').innerHTML = `<div class="card accent big-msg"><div class="ic">${ic}</div><h2>${tit}</h2><p>${esc(txt)}</p>
    <div class="row" style="justify-content:center">${admin ? '<button class="btn" id="bok">Voltar</button>' : '<button class="btn red" id="bsair2">Sair (liberar o tablet)</button><button class="btn ghost" id="bok">Continuar</button>'}</div>
    ${admin ? '' : '<p class="muted" id="cont">Saindo automaticamente em 20 s…</p>'}</div>`;
  $('#bok').onclick = () => { clearInterval(tmr); render(); };
  let s = 20, tmr = null;
  if (!admin) {
    $('#bsair2').onclick = () => { clearInterval(tmr); sair(); };
    tmr = setInterval(() => { s--; const c = $('#cont'); if (c) c.textContent = `Saindo automaticamente em ${s} s…`; if (s <= 0) { clearInterval(tmr); if ($('#cont')) sair(); } }, 1000);
  }
}

/* ================== FINALIZAR TURNO ================== */
async function telaFinalizar(c) {
  const st = { h: null, fh: null, fm: null };
  const tag = c.maquinas?.tag || '';
  $('#main').innerHTML = `<div class="row" style="justify-content:space-between"><h2>Finalizar turno – ${esc(tag)}</h2><button class="btn ghost sm" id="bvoltar">← Voltar</button></div>
    <div class="card accent"><div class="sec-title"><span class="n">Fim do turno</span></div>
      <p class="muted">Iniciado em ${fmtDT(c.iniciado_em)} com horímetro <b>${num(c.horimetro_inicial)}</b>.</p>
      <label>Horímetro final (horas)</label><input id="hf" type="number" step="1" min="0" inputmode="numeric" pattern="[0-9]*">
      <div class="muted" id="horas"></div>
      ${slotFoto('f-hf', 'Foto do horímetro final', 'O número precisa estar legível')}
      ${slotFoto('f-mf', 'Foto geral da máquina no fim do turno', 'Máquina inteira, estacionada')}
    </div><button class="btn red big" id="bfin">Finalizar turno</button>`;
  $('#bvoltar').onclick = () => render();
  $('#hf').oninput = e => { st.h = e.target.value; const v = lerHorimetro(st.h); $('#horas').textContent = isNaN(v) ? '' : `Horas operadas neste turno: ${num(v - c.horimetro_inicial)} h`; };
  $$('[data-foto]').forEach(b => b.onclick = async () => {
    const slot = b.dataset.foto;
    const f = await tirarFoto($('b', document.getElementById(slot)).textContent, tag);
    if (!f) return;
    if (slot === 'f-hf') st.fh = f.path; else st.fm = f.path;
    marcarSlot(slot, f);
  });
  $('#bfin').onclick = async () => {
    const h = lerHorimetro(st.h);
    if (isNaN(h)) return toast(st.h ? MSG_HORIM : 'Informe o horímetro final.', 'err');
    if (h < c.horimetro_inicial) return toast('O horímetro final não pode ser menor que o inicial.', 'err');
    if (!st.fh || !st.fm) return toast('Tire as duas fotos do fim do turno.', 'err');
    const b = $('#bfin'); b.disabled = true; b.textContent = 'Enviando…';
    const { error } = await sb.rpc('finalizar_turno', { p_checklist: c.id, p_horimetro_final: h, p_foto_horimetro: st.fh, p_foto_maquina: st.fm });
    if (error) { b.disabled = false; b.textContent = 'Finalizar turno'; return toast(erroMsg(error), 'err'); }
    toast(`Turno finalizado: ${num(h - c.horimetro_inicial)} h de operação.`, 'ok');
    if (gestor()) render(); else setTimeout(sair, 1500);
  };
}

/* ================== ADMIN: PAINEL ================== */
async function telaPainel() {

  ]);

  let html = '<h2>Painel da operação</h2>';
  (pend || []).forEach(c => {
    html += `<div class="alert warn"><div class="grow"><b>${esc(c.maquinas.tag)} aguarda sua decisão</b><br>${esc(c.operador.nome)} (${esc(c.operador.matricula)}) · ${fmtDT(c.iniciado_em)}</div>
      <button class="btn sm ghost" data-ver="${c.id}">Ver itens</button><button class="btn sm ok" data-lib="${c.id}">Liberar</button><button class="btn sm red" data-blq="${c.id}">Bloquear</button></div>`;

    else if (h !== null && Number(h) <= Number(m.aviso_antecedencia)) html += `<div class="alert warn"><div class="grow"><b>${esc(m.tag)}: preventiva em ${num(h)} h</b> (com ${num(m.proxima_preventiva)} h no horímetro). Programe a OS no Engeman.</div></div>`;
    if (m.status === 'bloqueada') html += `<div class="alert red"><div class="grow"><b>${esc(m.tag)} BLOQUEADA</b> · ${m.corretivas_abertas} corretiva(s) aberta(s)</div><button class="btn sm ghost" data-libm="${m.id}">Liberar máquina</button></div>`;
  });
  const emUso = maqs.filter(m => m.em_uso_por);
  html += `<h3>Operadores nas máquinas agora</h3><div class="card">${emUso.length ? `<div class="scroll"><table class="tbl"><tr><th>Máquina</th><th>Operador</th><th>Matrícula</th><th>Desde</th><th>Situação</th><th></th></tr>
    ${emUso.map(m => `<tr><td><b>${esc(m.tag)}</b></td><td>${esc(m.em_uso_por)}</td><td>${esc(m.em_uso_matricula)}</td><td>${fmtDT(m.em_uso_desde)}</td><td>${badge(STATUS_CL[m.checklist_aberto_status][0], STATUS_CL[m.checklist_aberto_status][1])}</td>
    <td>${m.checklist_aberto_status === 'em_andamento' ? `<button class="btn sm ghost" data-encerrar="${m.checklist_aberto_id}" data-tag="${esc(m.tag)}">Encerrar turno</button>` : ''}</td></tr>`).join('')}</table></div>` : '<p class="muted">Nenhuma máquina em operação no momento.</p>'}</div>`;
  html += `<h3>Máquinas</h3><div class="grid">${maqs.map(m => `<div class="card accent">
    <div class="maq"><div class="top"><div class="icon">${ICON_EMPILHADEIRA}</div><div><div class="tag">${esc(m.tag)}</div><div class="meta">${esc(m.tipo)}${m.modelo ? ' · ' + esc(m.modelo) : ''}</div></div></div></div>
    <div class="rows" style="margin-top:10px;display:grid;gap:5px;font-size:14px"><div>${statusMaquina(m)}</div>
    <div>⏱ Horímetro: <b>${num(m.horimetro_atual)} h</b></div><div>🔧 Próxima preventiva: <b>${num(m.proxima_preventiva)} h</b></div><div>${badgePreventiva(m)}</div>
    <div>Corretivas abertas: <b>${m.corretivas_abertas}</b></div></div>
    <div class="row" style="margin-top:10px">${m.status === 'liberada' ? `<button class="btn sm red" data-blqm="${m.id}">Bloquear</button>` : ''}${m.status === 'bloqueada' ? `<button class="btn sm ok" data-libm="${m.id}">Liberar</button>` : ''}</div></div>`).join('')}</div>`;
  $('#main').innerHTML = html;

  $$('[data-ver]').forEach(b => b.onclick = () => detalheChecklist(b.dataset.ver));
  $$('[data-lib],[data-blq]').forEach(b => b.onclick = async () => {
    const liberar = !!b.dataset.lib;
    const v = await formModal(liberar ? 'Liberar a máquina' : 'Bloquear a máquina', [{ name:'obs', label:'Observação do supervisor', type:'textarea', required:!liberar }], liberar ? 'Liberar' : 'Bloquear');
    if (!v) return;
    const { error } = await sb.rpc('decidir_supervisor', { p_checklist: b.dataset.lib || b.dataset.blq, p_liberar: liberar, p_obs: v.obs });
    error ? toast(erroMsg(error), 'err') : (toast('Decisão registrada.', 'ok'), render());
  });
  $$('[data-libm]').forEach(b => b.onclick = async () => {
    if (!confirm('Liberar a máquina para operação? Confirme que as corretivas foram resolvidas.')) return;
    const { error } = await sb.rpc('liberar_maquina', { p_maquina: b.dataset.libm });
    error ? toast(erroMsg(error), 'err') : (toast('Máquina liberada.', 'ok'), render());
  });
  $$('[data-blqm]').forEach(b => b.onclick = async () => {
    const v = await formModal('Bloquear máquina', [{ name:'motivo', label:'Motivo (abre uma corretiva)', type:'textarea', required:true }], 'Bloquear');

    error ? toast(erroMsg(error), 'err') : (toast('Máquina bloqueada.', 'ok'), render());
  });
  $$('[data-encerrar]').forEach(b => b.onclick = async () => {
    const { data: c } = await sb.from('checklists').select('*, maquinas(tag)').eq('id', b.dataset.encerrar).single();

  });
}

/* ================== DETALHE DE UM CHECKLIST ================== */
async function detalheChecklist(id) {
  const m = modal('<div class="loading">Carregando…</div>');
  const [{ data: c, error }, { data: resp }, { data: fs }, { data: itens }, { data: grupos }] = await Promise.all([
    sb.from('checklists').select('*, maquinas(tag), operador:profiles!checklists_operador_id_fkey(nome,matricula), sup:profiles!checklists_supervisor_id_fkey(nome)').eq('id', id).single(),
    sb.from('checklist_respostas').select('*').eq('checklist_id', id),
    sb.from('checklist_fotos').select('*').eq('checklist_id', id),
    sb.from('checklist_itens').select('*'),
    sb.from('checklist_grupos').select('*').order('ordem')
  ]);
  if (error) { m.el.innerHTML = `<div class="alert red">${esc(erroMsg(error))}</div>`; return; }
  const item = Object.fromEntries(itens.map(i => [i.id, i]));
  const fotos = [['Horímetro inicial', c.foto_horimetro_inicial], ['Máquina – início', c.foto_maquina_inicial], ['Horímetro final', c.foto_horimetro_final], ['Máquina – fim', c.foto_maquina_final]]
    .concat((fs || []).map(f => [grupos.find(g => g.id === f.grupo_id)?.nome || 'Seção', f.foto]))
    .concat((resp || []).filter(r => r.foto).map(r => ['NC: ' + (item[r.item_id]?.descricao || ''), r.foto]))
    .filter(f => f[1]);
  const urls = await Promise.all(fotos.map(f => urlFoto(f[1])));
  const [rt, rc] = RESULT[c.resultado]; const [stt, stc] = STATUS_CL[c.status];
  let html = `<h2>${esc(c.maquinas.tag)} · ${fmtDT(c.iniciado_em)}</h2>
    <div class="row">${badge(rt, rc)} ${badge(stt, stc)}</div>
    <p><b>Operador:</b> ${esc(c.operador.nome)} (${esc(c.operador.matricula)})<br>
    <b>Horímetro:</b> ${num(c.horimetro_inicial)} → ${num(c.horimetro_final)} ${c.horimetro_final ? `(<b>${num(c.horimetro_final - c.horimetro_inicial)} h</b>)` : ''}<br>
    <b>Fim:</b> ${fmtDT(c.finalizado_em)}
    ${c.supervisor_em ? `<br><b>Supervisor:</b> ${esc(c.sup?.nome || '')} – ${c.supervisor_decisao} em ${fmtDT(c.supervisor_em)}${c.supervisor_obs ? ' – ' + esc(c.supervisor_obs) : ''}` : ''}</p>
    <h3>Fotos</h3><div class="thumbs">${fotos.map((f, i) => urls[i] ? `<figure><img src="${esc(urls[i])}" data-zoom="${esc(urls[i])}"><figcaption>${esc(f[0])}</figcaption></figure>` : '').join('')}</div>`;
  grupos.forEach(g => {
    const rs = (resp || []).filter(r => item[r.item_id]?.grupo_id === g.id).sort((a, b) => item[a.item_id].ordem - item[b.item_id].ordem);
    if (!rs.length) return;
    html += `<h3>${esc(g.nome)}</h3><table class="tbl">${rs.map(r => `<tr><td>${esc(item[r.item_id].descricao)}${r.observacao ? `<br><span style="color:var(--red)"><b>Obs.:</b> ${esc(r.observacao)}</span>` : ''}</td>
      <td style="width:60px">${badge(r.resposta, r.resposta === 'C' ? 'b-ok' : r.resposta === 'NC' ? 'b-red' : 'b-gray')}</td></tr>`).join('')}</table>`;
  });
  m.el.innerHTML = `<button class="x">×</button>` + html;
  $('.x', m.el).onclick = m.fechar;
  $$('[data-zoom]', m.el).forEach(i => i.onclick = () => verImagem(i.dataset.zoom));
}

      <span class="muted"> (${lista.length} checklists)</span></div>

      ${lista.map(c => `<tr><td>${fmtDT(c.iniciado_em)}</td><td><b>${esc(c.maquinas.tag)}</b></td><td>${esc(c.operador.nome)}<br><span class="muted">${esc(c.operador.matricula)}</span></td>
        <td>${num(c.horimetro_inicial)}</td><td>${num(c.horimetro_final)}</td><td>${c.horimetro_final != null ? num(c.horimetro_final - c.horimetro_inicial) : '–'}</td>
        <td>${badge(...RESULT[c.resultado])}</td><td>${badge(...STATUS_CL[c.status])}</td><td><button class="btn sm ghost" data-ver="${c.id}">Ver</button></td></tr>`).join('') || '<tr><td colspan="9" class="muted">Nenhum checklist no período.</td></tr>'}</table></div>`;
    $$('[data-ver]').forEach(b => b.onclick = () => detalheChecklist(b.dataset.ver));
  };
  $('#bbusca').onclick = buscar;
  $('#bcsv').onclick = () => exportar('csv', filtros());
  $('#bxls').onclick = () => exportar('xlsx', filtros());
  $('#bpdf').onclick = () => exportar('pdf', filtros());
  buscar();
}
async function carregarChecklists(f) {
  let q = sb.from('checklists').select('*, maquinas(tag), operador:profiles!checklists_operador_id_fkey(nome,matricula), sup:profiles!checklists_supervisor_id_fkey(nome), checklist_respostas(item_id,resposta,observacao)')
    .gte('iniciado_em', new Date(f.d + 'T00:00:00-03:00').toISOString())
    .lte('iniciado_em', new Date(f.a + 'T23:59:59-03:00').toISOString())
    .order('iniciado_em', { ascending: true }).limit(2000);
  if (f.m) q = q.eq('maquina_id', f.m);
  if (f.r) q = q.eq('resultado', f.r);
  const { data, error } = await q;
  if (error) throw error;
  return data;
}
function carregarScript(src) {
  return new Promise((ok, falha) => {
    if ([...document.scripts].some(s => s.src === src)) return ok();
    const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => falha(new Error('Sem internet para carregar ' + src)); document.head.appendChild(s);
  });
}
function baixar(blob, nome) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nome; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }
async function exportar(tipo, f) {
  try {
    toast('Gerando arquivo…');
    const [lista, { data: itens }, { data: grupos }] = await Promise.all([carregarChecklists(f), sb.from('checklist_itens').select('*').order('grupo_id').order('ordem'), sb.from('checklist_grupos').select('*').order('ordem')]);
    if (!lista.length) return toast('Nenhum checklist no período.', 'err');
    const gnome = Object.fromEntries(grupos.map(g => [g.id, g.nome]));
    const usados = itens.filter(i => lista.some(c => c.checklist_respostas.some(r => r.item_id === i.id)));
    const rotulo = i => (i.grupo_id === 1 ? `${i.ordem}. ` : `[${gnome[i.grupo_id]}] `) + i.descricao;
    const nomeArq = `checklists_${f.d}_a_${f.a}`;
    const linhas = lista.map(c => {
      const r = Object.fromEntries(c.checklist_respostas.map(x => [x.item_id, x]));
      const o = { 'Data': fmtD(c.iniciado_em), 'Início': fmtH(c.iniciado_em), 'Fim': c.finalizado_em ? fmtDT(c.finalizado_em) : '', 'Máquina': c.maquinas.tag,
        'Operador': c.operador.nome, 'Matrícula': c.operador.matricula, 'Horímetro inicial': c.horimetro_inicial, 'Horímetro final': c.horimetro_final ?? '',
        'Horas operadas': c.horimetro_final != null ? +(c.horimetro_final - c.horimetro_inicial).toFixed(1) : '', 'Resultado': RESULT[c.resultado][0], 'Situação': STATUS_CL[c.status][0],
        'Supervisor': c.sup?.nome || '', 'Decisão supervisor': c.supervisor_decisao || '', 'Obs. supervisor': c.supervisor_obs || '' };
      usados.forEach(i => { o[rotulo(i)] = r[i.id]?.resposta || ''; });
      o['Não conformidades'] = c.checklist_respostas.filter(x => x.resposta === 'NC').map(x => `${itens.find(i => i.id === x.item_id)?.descricao}: ${x.observacao || ''}`).join(' | ');
      return o;
    });
    if (tipo === 'csv') {
      const cols = Object.keys(linhas[0]);
      const cel = v => { const s = String(v ?? ''); return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
      const csv = '﻿' + [cols.join(';')].concat(linhas.map(l => cols.map(k => cel(typeof l[k] === 'number' ? String(l[k]).replace('.', ',') : l[k])).join(';'))).join('\r\n');
      return baixar(new Blob([csv], { type: 'text/csv;charset=utf-8' }), nomeArq + '.csv');
    }
    if (tipo === 'xlsx') {
      await carregarScript('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js');
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(linhas), 'Checklists');
      const ncs = [];
      lista.forEach(c => c.checklist_respostas.filter(x => x.resposta === 'NC').forEach(x => { const i = itens.find(y => y.id === x.item_id);
        ncs.push({ 'Data': fmtDT(c.iniciado_em), 'Máquina': c.maquinas.tag, 'Operador': c.operador.nome, 'Seção': gnome[i.grupo_id], 'Item': i.descricao, 'Se NC': ACAO[i.acao_nc], 'Observação': x.observacao || '' }); }));
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(ncs.length ? ncs : [{ 'Info': 'Nenhuma não conformidade no período' }]), 'Não conformidades');
      const horas = {};
      lista.forEach(c => { if (c.horimetro_final != null) horas[c.maquinas.tag] = (horas[c.maquinas.tag] || 0) + (c.horimetro_final - c.horimetro_inicial); });
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(Object.entries(horas).map(([t, h]) => ({ 'Máquina': t, 'Horas operadas': +h.toFixed(1) }))), 'Horas por máquina');
      return XLSX.writeFile(wb, nomeArq + '.xlsx');
    }
    // PDF: ficha no formato do papel (itens x dias), uma por máquina
    await carregarScript('https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js');
    await carregarScript('https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js');
    const doc = new window.jspdf.jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
    const porMaq = {};
    lista.forEach(c => (porMaq[c.maquinas.tag] = porMaq[c.maquinas.tag] || []).push(c));
    Object.keys(porMaq).sort().forEach((tag, idx) => {
      const cs = porMaq[tag];
      if (idx > 0) doc.addPage();
      doc.setFillColor(11, 31, 58); doc.rect(0, 0, 297, 18, 'F'); doc.setFillColor(200, 16, 46); doc.rect(237, 0, 60, 18, 'F');
      doc.setTextColor(255); doc.setFontSize(13); doc.text('Inspeção Diária de Empilhadeira Elétrica', 10, 8);
      doc.setFontSize(10); doc.text(`Tag: ${tag}    Período: ${f.d.split('-').reverse().join('/')} a ${f.a.split('-').reverse().join('/')}`, 10, 14);
      doc.setTextColor(0);
      const head = [['Item', 'Se NC'].concat(cs.map(c => fmtD(c.iniciado_em).slice(0, 5) + '\n' + fmtH(c.iniciado_em)))];
      const body = usados.map(i => [rotulo(i), ACAO[i.acao_nc]].concat(cs.map(c => c.checklist_respostas.find(r => r.item_id === i.id)?.resposta || '')));
      body.push(['Horímetro inicial', ''].concat(cs.map(c => num(c.horimetro_inicial))));
      body.push(['Horímetro final', ''].concat(cs.map(c => num(c.horimetro_final))));
      body.push(['Operador', ''].concat(cs.map(c => c.operador.nome)));
      body.push(['Matrícula', ''].concat(cs.map(c => c.operador.matricula)));
      doc.autoTable({ head, body, startY: 22, theme: 'grid', horizontalPageBreak: true, horizontalPageBreakRepeat: [0, 1],
        styles: { fontSize: 6.5, cellPadding: 1, halign: 'center', valign: 'middle' },
        headStyles: { fillColor: [18, 48, 94], textColor: 255 },
        columnStyles: { 0: { halign: 'left', cellWidth: 70 }, 1: { cellWidth: 18 } },
        didParseCell: d => { if (d.section === 'body' && d.cell.raw === 'NC') { d.cell.styles.fillColor = [200, 16, 46]; d.cell.styles.textColor = 255; d.cell.styles.fontStyle = 'bold'; } } });
      const obs = [];
      cs.forEach(c => { c.checklist_respostas.filter(r => r.resposta === 'NC').forEach(r => obs.push([fmtDT(c.iniciado_em), itens.find(i => i.id === r.item_id)?.descricao || '', r.observacao || '', c.sup?.nome ? `${c.sup.nome}: ${c.supervisor_decisao || ''} ${c.supervisor_obs || ''}` : ''])); });
      doc.autoTable({ head: [['Data', 'Item', 'Descrição da observação', 'Ciência do supervisor']], body: obs.length ? obs : [['', 'Sem não conformidades no período', '', '']],
        startY: doc.lastAutoTable.finalY + 6, theme: 'grid', styles: { fontSize: 7.5 }, headStyles: { fillColor: [200, 16, 46], textColor: 255 } });
      doc.setFontSize(7); doc.setTextColor(90);
      doc.text('Legenda: C - Conforme · NC - Não conforme · NA - Não aplicável. Itens NC "Parar": máquina não pode operar. "Decidir c/ supervisor": supervisor avalia.', 10, 205);
    });
    doc.save(nomeArq + '.pdf');
  } catch (e) { toast(erroMsg(e), 'err'); }
}

}
async function telaUsuarios() {
  const { data: us0, error } = await sb.from('profiles').select('*').order('nome');
  if (error) throw error;
  const ordem = { admin:0, lider:1, operador:2 };
  const us = us0.sort((a, b) => ordem[a.role] - ordem[b.role] || a.nome.localeCompare(b.nome));
  const opcoesPerfil = [['operador','Operador – só faz checklist'],['lider','Líder – painel, liberar/bloquear, histórico e manutenções'],['admin','Administrador – tudo, inclusive cadastros e usuários']];
  $('#main').innerHTML = `<div class="row" style="justify-content:space-between"><h2>Usuários</h2><button class="btn red" id="bnovo">+ Novo usuário</button></div>
    <p class="muted">Cada pessoa entra com a <b>matrícula</b> e a senha, e cada checklist fica registrado no nome dela, no lugar da assinatura do papel.<br>
    <b>Operador:</b> faz o checklist e finaliza o turno. <b>Líder:</b> também vê o painel, libera/bloqueia máquinas, vê o histórico, exporta e conclui manutenções.
    <b>Administrador:</b> tudo isso + cadastro de máquinas, equipamentos, itens e usuários.</p>
    <div class="card scroll"><table class="tbl"><tr><th>Nome</th><th>Matrícula</th><th>Perfil</th><th>Situação</th><th></th></tr>
    ${us.map(u => `<tr><td><b>${esc(u.nome)}</b></td><td>${esc(u.matricula)}</td><td>${badge(PERFIS[u.role], PERFIL_BADGE[u.role])}</td>
      <td>${u.ativo ? badge('Ativo', 'b-ok') : badge('Desativado', 'b-gray')}</td>
      <td class="row"><button class="btn sm" data-edu="${u.id}">Editar</button><button class="btn sm ghost" data-senha="${u.id}" data-nome="${esc(u.nome)}">Nova senha</button>
      ${u.id !== S.user.id ? `<button class="btn sm ${u.ativo ? 'red' : 'ok'}" data-ativo="${u.id}" data-v="${u.ativo ? 0 : 1}">${u.ativo ? 'Desativar' : 'Reativar'}</button>` : ''}</td></tr>`).join('')}</table></div>`;
  $('#bnovo').onclick = async () => {
    const v = await formModal('Novo usuário', [
      { name:'nome', label:'Nome completo', required:true },
      { name:'matricula', label:'Matrícula: 8 números + letras (ex.: 10109256J ou 10109256SJ)', required:true, placeholder:'10109256J' },
      { name:'senha', label:'Senha inicial (mínimo 6 caracteres)', required:true },
      { name:'role', label:'Tipo de usuário', type:'select', value:'operador', options:opcoesPerfil }], 'Cadastrar');
    if (!v) return;
    v.matricula = v.matricula.replace(/\s+/g, '').toUpperCase();
    if (!MATRICULA_OK.test(v.matricula)) return toast('Matrícula inválida: 8 números seguidos das letras (ex.: 10109256J).', 'err');
    try { await chamarUsuarios({ acao:'criar', ...v }); toast(`Usuário criado. Login: matrícula ${v.matricula}.`, 'ok'); render(); } catch (e) { toast(erroMsg(e), 'err'); }
  };
  $$('[data-edu]').forEach(b => b.onclick = async () => {
    const u = us.find(x => x.id === b.dataset.edu);
    const v = await formModal('Editar usuário – ' + u.matricula, [
      { name:'nome', label:'Nome completo', value:u.nome, required:true },
      { name:'role', label:'Tipo de usuário', type:'select', value:u.role, options:opcoesPerfil }]);
    if (!v) return;
    if (u.id === S.user.id && v.role !== 'admin') return toast('Você não pode tirar o seu próprio perfil de administrador.', 'err');
    const { error } = await sb.from('profiles').update({ nome: v.nome, role: v.role }).eq('id', u.id);
    error ? toast(erroMsg(error), 'err') : (toast('Usuário atualizado.', 'ok'), render());
  });
  $$('[data-senha]').forEach(b => b.onclick = async () => {
    const v = await formModal('Nova senha – ' + b.dataset.nome, [{ name:'senha', label:'Nova senha (mínimo 6 caracteres)', required:true }]);
    if (!v) return;
    try { await chamarUsuarios({ acao:'senha', id:b.dataset.senha, senha:v.senha }); toast('Senha alterada.', 'ok'); } catch (e) { toast(erroMsg(e), 'err'); }
  });
  $$('[data-ativo]').forEach(b => b.onclick = async () => {
    try { await chamarUsuarios({ acao:'ativo', id:b.dataset.ativo, ativo:b.dataset.v === '1' }); toast('Usuário atualizado.', 'ok'); render(); } catch (e) { toast(erroMsg(e), 'err'); }
  });
}

/* ================== INÍCIO ================== */
sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_OUT' && S.user) telaLogin(); });
iniciar();
</script>
</body>
